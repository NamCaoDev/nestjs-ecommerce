name: nestjs-ecommerce

services:
  postgres:
    image: postgres:16-alpine
    container_name: ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_MULTIPLE_DATABASES: order_db,inventory_db,customer_db,payment_db
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:-service_password}
    ports:
      - '${POSTGRES_HOST_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./tools/docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: ecommerce-redis
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--requirepass',
        '${REDIS_PASSWORD:-redis_password}',
        '--appendonly',
        'yes',
      ]
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test:
        [
          'CMD',
          'redis-cli',
          '-a',
          '${REDIS_PASSWORD:-redis_password}',
          '--no-auth-warning',
          'ping',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: ecommerce-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:29092,external://0.0.0.0:9092
      - --advertise-kafka-addr internal://redpanda:29092,external://localhost:9092
      - --pandaproxy-addr internal://0.0.0.0:28082,external://0.0.0.0:8082
      - --advertise-pandaproxy-addr internal://redpanda:28082,external://localhost:8082
      - --schema-registry-addr internal://0.0.0.0:28081,external://0.0.0.0:8081
      - --rpc-addr redpanda:33145
      - --advertise-rpc-addr redpanda:33145
      - --mode dev-container
      - --smp 1
      - --default-log-level=info
    ports:
      - '9092:9092'
      - '8081:8081'
      - '8082:8082'
      - '9644:9644'
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test:
        ['CMD-SHELL', "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: ecommerce-redpanda-console
    restart: unless-stopped
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda:29092"]
          schemaRegistry:
            enabled: true
            urls: ["http://redpanda:28081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda:9644"]
    ports:
      - '${REDPANDA_CONSOLE_HOST_PORT:-8080}:8080'
    depends_on:
      redpanda:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Application services (opt-in): docker compose --profile app up -d --build
  # Migrations run first as one-off jobs; services talk over the compose network.
  # ---------------------------------------------------------------------------
  order-migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
      target: migrate
    image: order-service-migrate:local
    environment:
      DATABASE_URL: postgresql://order_db_user:${SERVICE_DB_PASSWORD:-service_password}@postgres:5432/order_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  inventory-migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
      target: migrate
    image: inventory-service-migrate:local
    environment:
      DATABASE_URL: postgresql://inventory_db_user:${SERVICE_DB_PASSWORD:-service_password}@postgres:5432/inventory_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  inventory-service:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/inventory-service/Dockerfile
      target: runtime
    image: inventory-service:local
    container_name: ecommerce-inventory-service
    init: true
    environment:
      DATABASE_URL: postgresql://inventory_db_user:${SERVICE_DB_PASSWORD:-service_password}@postgres:5432/inventory_db?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      KAFKA_BROKERS: redpanda:29092
      INVENTORY_GRPC_PORT: '50051'
    ports:
      - '${INVENTORY_HTTP_HOST_PORT:-3200}:3200'
      - '${INVENTORY_GRPC_HOST_PORT:-50051}:50051'
    depends_on:
      inventory-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy

  order-service:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/order-service/Dockerfile
      target: runtime
    image: order-service:local
    container_name: ecommerce-order-service
    init: true
    environment:
      DATABASE_URL: postgresql://order_db_user:${SERVICE_DB_PASSWORD:-service_password}@postgres:5432/order_db?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      KAFKA_BROKERS: redpanda:29092
      INVENTORY_GRPC_HOST: inventory-service
      INVENTORY_GRPC_PORT: '50051'
    ports:
      - '${ORDER_HTTP_HOST_PORT:-3100}:3100'
    depends_on:
      order-migrate:
        condition: service_completed_successfully
      inventory-service:
        condition: service_healthy

  payment-migrate:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
      target: migrate
    image: payment-service-migrate:local
    environment:
      DATABASE_URL: postgresql://payment_db_user:${SERVICE_DB_PASSWORD:-service_password}@postgres:5432/payment_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy

  payment-service:
    profiles: [app]
    build:
      context: .
      dockerfile: apps/payment-service/Dockerfile
      target: runtime
    image: payment-service:local
    container_name: ecommerce-payment-service
    init: true
    environment:
      DATABASE_URL: postgresql://payment_db_user:${SERVICE_DB_PASSWORD:-service_password}@postgres:5432/payment_db?schema=public
      KAFKA_BROKERS: redpanda:29092
      MOCK_GATEWAY_SECRET: ${MOCK_GATEWAY_SECRET:-local-mock-gateway-secret-change-me}
      # Local stack only: exposes POST /api/payments/mock-gateway/pay.
      MOCK_GATEWAY_ENABLED: 'true'
    ports:
      - '${PAYMENT_HTTP_HOST_PORT:-3300}:3300'
    depends_on:
      payment-migrate:
        condition: service_completed_successfully
      redpanda:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  redpanda-data:
