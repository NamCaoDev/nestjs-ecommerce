name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NX_NO_CLOUD: true
  NX_DAEMON: false

jobs:
  main:
    name: Format, lint, test, build, typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - run: npx nx format:check --base="remotes/origin/main"
      - run: npx nx run-many -t lint test build typecheck

  e2e:
    name: End-to-end (Postgres, Redis, Redpanda)
    needs: main
    runs-on: ubuntu-latest
    env:
      # Matches DATABASE_URL in the services' .env.example.
      POSTGRES_HOST_PORT: 5433
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      - name: Start infrastructure
        run: docker compose up -d --wait

      - name: Configure services
        run: |
          cp apps/order-service/.env.example apps/order-service/.env
          cp apps/inventory-service/.env.example apps/inventory-service/.env

      - name: Migrate and seed
        run: |
          npx nx run order-service:prisma-deploy
          npx nx run inventory-service:prisma-deploy
          npx nx run inventory-service:seed-stock

      # Run one suite at a time: each suite's teardown frees the ports of the services it started.
      - run: npx nx e2e inventory-service-e2e
      - run: npx nx e2e order-service-e2e

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
